  about: |
    The Translational Sensory & Circadian Neuroscience Unit (MPS/TUM/TUMCREATE) investigates how light, sensory experience and biological rhythms affect human physiology, behaviour and health. Methods include human experiments, environmental measurement, evidence synthesis and social research.

    Student projects can be based in Tübingen, Munich or remotely, depending on the work involved. Scope, location and supervision are agreed individually.

    This site also lists [job vacancies](/jobs.html), [PhD opportunities](/phd.html) and [external funding routes](/funding.html). We consider [short research visits](/research-visits.html) and [other forms of collaboration](/collaborations.html), including residencies, when there is a suitable proposal and mutual benefit.

    ## Research approach

    Our [mission statement](https://www.tscnlab.org/mission-statement) describes our approach to reproducible research, collaboration and working conditions. The [unit website](https://www.tscnlab.org/) has further information about the group and its research.

    [Student projects](/student-projects.html) · [General expectations](/expectations.html) · [How to apply](/apply.html)
  expectations: |
    The expectations below apply to [student projects and research internships](/student-projects.html). Requirements for jobs and doctoral programmes are specified in their calls; research visits and other collaborations are agreed individually.

    These projects address open research questions rather than predefined teaching exercises. Students are expected to work independently, document decisions and take increasing responsibility, with feedback from their supervisor.

    You should already be able to:

    - Analyse data using **R or Python**. You do not need to know both.
    - Use **Git and GitHub** to keep track of your work.
    - Work reproducibly, from organised inputs to documented outputs.
    - Engage independently with scientific literature.
    - Document decisions, methods and results carefully.

    Previous sleep or circadian research experience is not generally required unless an advert explicitly says otherwise. Project-specific backgrounds are suggestions: explain how your skills connect to the question.

    ## Project scope

    We will discuss a scope that fits your time, experience and academic requirements. A short placement may focus on one part of a larger study; a thesis may take a question through a more complete research cycle. Human-participant work depends on the relevant approvals, training and supervision.

    [Read about funding](/funding.html) · [How to apply](/apply.html)
  funding: |
    External funding may support a research visit, doctoral research, a postdoctoral project or a student placement. The routes below concern research stays in Germany; eligibility depends on the programme, your career stage and your circumstances.

    If you would like us to host a funded project, [contact us with your research idea and the programme you have in mind](/apply.html#fellowships-and-research-visits). We will need to discuss scientific fit, supervision and resources before agreeing to support an application. Each funder sets its own eligibility rules, calls and deadlines; use the official links below to check them.

    ## Doctoral research and research visits

    For structured doctoral programmes and their 2026 deadlines, see [PhD opportunities](/phd.html). For a shorter stay, see [Research visits](/research-visits.html). Programme admission and funding for a position in the unit need to be confirmed separately.

    ### DAAD

    The German Academic Exchange Service offers several funding routes for study and research in Germany. Its **Research Grants in Germany** programme supports research stays during a doctorate undertaken outside Germany or in the early postdoctoral phase. Other schemes have different purposes and requirements. Use your country of residence, career stage and subject to find relevant options in the [DAAD scholarship database](https://www2.daad.de/deutschland/stipendium/datenbank/en/21148-scholarship-database/).

    ## Postdoctoral funding

    ### Alexander von Humboldt Foundation

    The [Humboldt Research Fellowship](https://www.humboldt-foundation.de/en/apply/sponsorship-programmes/humboldt-research-fellowship) supports postdoctoral and experienced researchers from abroad in carrying out their own research with a host in Germany. It requires an agreed research project and host support. Check the foundation's current call status, career-stage and residence requirements before preparing an application.

    ### Marie Skłodowska-Curie Actions

    [MSCA Postdoctoral Fellowships](https://marie-sklodowska-curie-actions.ec.europa.eu/actions/postdoctoral-fellowships) support researchers with a doctorate who wish to carry out a research and training project. A **European Postdoctoral Fellowship** may be a route to joining a host in Germany. The proposal is prepared with the host organisation, which submits it. Mobility and research-experience rules apply.

    ### DFG Walter Benjamin Programme

    The [Walter Benjamin Programme](https://www.dfg.de/en/research-funding/funding-opportunities/programmes/individual/walter-benjamin) supports an independent project in the early postdoctoral phase. For work in Germany, the funding takes the form of a position at the host institution. A change of research environment is normally expected, and the host must provide project resources and career support. Discuss the institutional arrangements with us before applying.

    ## Student projects and placements

    **Unless explicitly stated otherwise, student projects do not include a salary or stipend from the research group. Master's thesis projects are generally unpaid.**

    Students may have support through scholarships, their home university or mobility programmes. Mention any proposed funding when enquiring about a project.

    ### Erasmus+ {#erasmus}

    [Erasmus+ traineeships](https://erasmus-plus.ec.europa.eu/opportunities/individuals/students/traineeships-abroad-for-students) can support eligible students, including doctoral candidates, and recent graduates undertaking a placement abroad. Ask your home university's international or Erasmus+ office about eligibility, supported duration, funding and application procedures. The research placement and any required learning agreement need to be agreed with the host.

    ### Centrally organised placements

    Some placements may be offered through [CaCTüS in Tübingen](https://www.projects.tuebingen.mpg.de/internship/) or [TUM PREP in Munich](https://www.global.tum.de/en/global/prep/). These programmes have their own eligibility, application, selection and funding procedures. Applicants must follow the programme's process; funding cannot be obtained directly from the research group, and not every project listed here is part of a central programme.

    [How to enquire about a project or fellowship](/apply.html) · [Job vacancies](/jobs.html)
  apply: |
    **Only requests sent by email will be considered.** Messages or comments on LinkedIn will not be considered, even if the opportunity was advertised there. Phone calls will not be considered.

    This applies to enquiries made directly to the unit. Applications to structured doctoral programmes, funding schemes or centrally organised placements must follow the programme's own process.

    Email Prof. Manuel Spitschan using the addresses below. The information to include depends on the type of enquiry.

    ## Student projects and research internships

    To enquire about a [BSc/MSc project or research internship](/student-projects.html), include:

    - The **project title or link**, and a short explanation of your interest.
    - A **CV** and relevant skills or examples of work, such as an analysis or code repository if available.
    - Your **degree programme and home institution**, including any thesis or placement requirements.
    - Your preferred **format, dates, duration and location**.
    - Any **external funding or mobility programme** you plan to use.

    Please read the [general expectations](/expectations.html) and [student funding information](/funding.html#student-projects-and-placements). Confirm degree-credit requirements with your home institution. For CaCTüS or TUM PREP, follow the programme's application procedure.

    ## PhD opportunities

    PhD positions are usually advertised under [Jobs](/jobs.html). Follow the instructions in the vacancy notice. The [PhD opportunities page](/phd.html) also lists structured programmes and their 2026 deadlines. Apply through the relevant programme's process and observe its rules on contacting potential supervisors. Programme admission does not guarantee a funded position with Prof. Manuel Spitschan.

    ## Fellowships and research visits

    For a [short research visit](/research-visits.html) or a fellowship, including enquiries about [external funding](/funding.html), include:

    - A **short research outline** and how it relates to the unit's work.
    - Your **CV**, current institution and career stage, with relevant publications or other work where applicable.
    - The **funding programme and official call link**, its deadline and whether funding is planned or already awarded.
    - Your preferred **host location, start date and duration**, and any facilities or other support the project would need.

    Contact us before submitting an application that names us as a host, allowing time to discuss the proposal and any institutional requirements. Hosting depends on scientific fit, supervision and resources; an enquiry does not constitute a commitment to host or fund the work.

    ## Wildcard collaborations

    For [other forms of collaboration](/collaborations.html), such as an artist, writer or architect in residence, send a short proposal with a **clear goal and work plan**. Explain its connection to the unit's research, your relevant experience or examples of work, the planned activities and outcome, and an indicative timetable. Mention any funding you have or intend to seek.

    ## Job applications

    See the [jobs page](/jobs.html) for current vacancies. For an advertised position, follow the email application instructions and deadline in the vacancy notice.

    ## Where to write

    Contact Prof. Manuel Spitschan:

    - **Munich / TUM:** [manuel.spitschan@tum.de](mailto:manuel.spitschan@tum.de)
    - **Tübingen / MPI:** [manuel.spitschan@tuebingen.mpg.de](mailto:manuel.spitschan@tuebingen.mpg.de)

    For remote projects, use the address that best matches your institutional connection, or either address if unsure. TUM students should use the TUM address. The lab's [contact page](https://www.tscnlab.org/contact) has further details.

