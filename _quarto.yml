project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - student-projects.qmd
    - jobs.qmd
    - about.qmd
    - expectations.qmd
    - funding.qmd
    - apply.qmd
    - programmes.qmd
    - 404.qmd
    - projects/*/index.qmd
  pre-render:
    - python3 scripts/build.py prepare
  post-render:
    - python3 scripts/build.py finish
  resources:
    - assets/tscn-logo.png
    - assets/favicon.png
    - assets/social-preview.png
    - assets/site.css
    - assets/search.js
    - CNAME
    - robots.txt
website:
  title: Translational Sensory & Circadian Neuroscience Unit (MPS/TUM/TUMCREATE)
  site-url: https://join.tscnlab.org
  favicon: assets/favicon.png
  image: /assets/social-preview.png
  description: Student projects, jobs and external funding routes for research on light, sleep and circadian rhythms.
  search: false
  open-graph: true
  twitter-card:
    card-style: summary_large_image
format:
  html:
    theme: none
    css: /assets/site.css
    toc: false
    title-block-style: none
    template-partials:
      - templates/title-block.html
    anchor-sections: false
    link-external-newwindow: false
    lang: en
    filters:
      - filters/layout.lua
    include-after-body:
      - text: '<script src="/assets/search.js" defer></script>'
execute:
  enabled: false
